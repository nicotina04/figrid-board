[package]
name = "figrid-board"
version = "0.8.5"
authors = [
    "nicotina04 <devherdson@gmail.com>",
    "wuwbobo2021 <wuwbobo@outlook.com>",
]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nicotina04/figrid-board"
readme = "README.md"
description = """
A Rust library and Piskvork-compatible engine for Five-in-a-Row.
"""

keywords = ["game", "board", "gomoku"]
categories = ["data-structures", "game-development"]

# Keep raw NNUE weights out of crates.io. The compressed deployment weight is
# packaged so the advertised `embed-weights` feature also builds downstream;
# it remains disabled by default and keeps the crate below the 10 MB limit.
exclude = [
    "models/*.bin",
    "experiments/**",
    "!/experiments/2026-07-26/cb_gh1_threat_graph_preregister.md",
    "!/experiments/2026-07-26/cb_qat1_integer_lattice_preregister.md",
    "!/experiments/2026-07-26/cb_al1_active_distillation_preregister.md",
    "!/experiments/2026-07-26/cb_p1_bounded_dfpn_preregister.md",
    "!/experiments/2026-07-26/cb_p1_p0_invalid.md",
    "!/experiments/2026-07-26/cb_p1_p0b_dedup_manifest.json",
    "!/experiments/2026-07-26/cb_p1_p0b_preregister.md",
]

[features]
default = []
# Embed compressed v52 NNUE weights into the binary at build time. Used for
# the `pbrain-figrid` Gomocup submission build where Piskvork expects a
# single self-contained executable. crates.io publishes do NOT enable this.
embed-weights = ["dep:flate2"]
# Pull noru's AVX-512F+BW SIMD path. Opt-in so that crates.io publishes and
# downstream users on Rust < 1.89 are not forced through unstable target_feature
# gates. Runtime-dispatched — auto-falls back to AVX-2 on CPUs without
# AVX-512, so enabling this is strictly an opportunistic 1.5-2× speedup on
# Skylake-X+, Ice Lake server, Sapphire Rapids, and AVX-512-VNNI consumer
# parts. The Gomocup submission build should turn this on; library users on
# stable Rust should leave it off.
avx512 = ["noru/avx512"]
# Codebook(no-MP) evaluator promoted by RQ570 as the 0.8 pbrain deployment
# eval path. Optional for library users; pbrain builds with this feature load the
# embedded swap-closed codebook and use the quantized kernel by default.
codebook-eval = ["dep:cb2vec"]
# CB-F1 compact-flat counterfactual. Never enabled by default; product code
# uses it only to attribute serialization savings separately from the exact
# factored embedding representation.
cb-f1-flat-asset = ["codebook-eval"]
# CB-AL1 preregistered audit surface. Default-off and used only by the
# label-blind selector binary to compare factored access with flat replay.
cb-al1-audit = ["codebook-eval"]
# CB-P1 exact bounded-DFPN census. Audit-only and default-off.
cb-p1-audit = []

[dependencies]
noru = { version = "2.2" }
cb2vec = { version = "0.2.2", optional = true }
flate2 = { version = "1", optional = true }
serde_json = "1"

[dev-dependencies]
# Speed/regression micro-benchmarks (see benches/engine.rs). Light profile:
# default features off drops the plotters/rayon HTML-report stack — console
# output is enough for "did this change get faster or slower?".
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "engine"
harness = false

[lib]
name = "figrid_board"
path = "src/lib.rs"

[[bin]]
name = "pbrain-figrid-legacy"
path = "main.rs"

[[bin]]
name = "pbrain-figrid"
path = "bin/pbrain_figrid_noru.rs"

[[bin]]
name = "relation-lite-val"
path = "bin/relation_lite_val.rs"

[[bin]]
name = "relation-root-audit"
path = "bin/relation_root_audit.rs"

[[bin]]
name = "rq423-feature-dump"
path = "bin/rq423_feature_dump.rs"

[[bin]]
name = "rq544-eval-scale"
path = "bin/rq544_eval_scale.rs"
required-features = ["codebook-eval"]

[[bin]]
name = "rq545-stratified-bce"
path = "bin/rq545_stratified_bce.rs"
required-features = ["codebook-eval"]

[[bin]]
name = "rq547-vct-solve"
path = "bin/rq547_vct_solve.rs"

[[bin]]
name = "rq554-quant-kernel-check"
path = "bin/rq554_quant_kernel_check.rs"
required-features = ["codebook-eval"]

[[bin]]
name = "rq558b-color-symmetry"
path = "bin/rq558b_color_symmetry.rs"
required-features = ["codebook-eval"]

[[bin]]
name = "rq572-classify-equivalence"
path = "bin/rq572_classify_equivalence.rs"

[[bin]]
name = "rq574-threat-index-check"
path = "bin/rq574_threat_index_check.rs"

[[bin]]
name = "rq576-reach-mask-check"
path = "bin/rq576_reach_mask_check.rs"

[[bin]]
name = "rq578-immediate-five-check"
path = "bin/rq578_immediate_five_check.rs"

[[bin]]
name = "rq587-threat-field-check"
path = "bin/rq587_threat_field_check.rs"

[[bin]]
name = "rq582-search-profile"
path = "bin/rq582_search_profile.rs"
required-features = ["codebook-eval"]

[[bin]]
name = "rq597-tss-candidate-probe"
path = "bin/rq597_tss_candidate_probe.rs"

[[bin]]
name = "rq598-tss-dependency-probe"
path = "bin/rq598_tss_dependency_probe.rs"

[[bin]]
name = "rq599-quiet-label-classify"
path = "bin/rq599_quiet_label_classify.rs"

[[bin]]
name = "rq602-tss-q1-solve"
path = "bin/rq602_tss_q1_solve.rs"

[[bin]]
name = "rq603-response-relevance"
path = "bin/rq603_response_relevance.rs"

[[bin]]
name = "cb-d1-ab"
path = "bin/cb_d1_ab.rs"
required-features = ["codebook-eval"]

[[bin]]
name = "cb-f1-pack"
path = "bin/cb_f1_pack.rs"
required-features = ["codebook-eval"]

[[bin]]
name = "cb-voc1-census"
path = "bin/cb_voc1_census.rs"
required-features = ["codebook-eval"]

[[bin]]
name = "cb-gh0-precondition"
path = "bin/cb_gh0_precondition.rs"
required-features = ["codebook-eval"]

[[bin]]
name = "cb-gh0-hash-correctness"
path = "bin/cb_gh0_hash_correctness.rs"

[[bin]]
name = "cb-gh0-hash-cost"
path = "bin/cb_gh0_hash_cost.rs"
required-features = ["codebook-eval"]

[[bin]]
name = "cb-gh1-graph-census"
path = "bin/cb_gh1_graph_census.rs"
required-features = ["codebook-eval"]

[[bin]]
name = "cb-qat1-headroom"
path = "bin/cb_qat1_headroom.rs"
required-features = ["codebook-eval"]

[[bin]]
name = "cb-al1-selector"
path = "bin/cb_al1_selector.rs"
required-features = ["cb-al1-audit"]

[[bin]]
name = "cb-p1-census"
path = "bin/cb_p1_census.rs"
required-features = ["cb-p1-audit"]

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
strip = true
panic = "abort"

# Keep this crate standalone when checked out inside a larger Cargo workspace.
[workspace]
resolver = "2"
